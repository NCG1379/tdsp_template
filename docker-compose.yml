services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - MONGO_URI=mongodb://db:27017/langchainAgent

  frontend:
    build:
      context: .
      dockerfile: DockerfileFront
    ports:
      - "3000:3000"
    depends_on:
      - app

  db:
    image: mongo:8.0.11
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
